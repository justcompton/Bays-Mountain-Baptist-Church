<style>
  .nav-toggle {
    display: none;
  }
  .hamburger-btn {
    display: block;
    background: none;
    border: none;
    font-size: 1.8rem;
    color: white;
    cursor: pointer;
    padding: 0;
  }
  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    padding-top: 1rem;
    padding-left: 0.5rem;
  }
  .nav-toggle:checked ~ .nav-links {
    display: flex;
  }
</style>

<nav class="pv3 ph3 ph4-ns" role="navigation">
  <input type="checkbox" id="nav-toggle" class="nav-toggle">

  <div class="flex items-center justify-between">
    <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline">
      {{ .Site.Title }}
    </a>
    <label for="nav-toggle" class="hamburger-btn">&#9776;</label>
  </div>

  {{ if .Site.Menus.main }}
  <div class="nav-links">
    <ul class="pl0 mr3">
      {{ range .Site.Menus.main }}
      <li class="list f5 f4-ns fw4 dib pr3">
        <a class="hover-white white-90 no-underline" href="{{ .URL }}" title="{{ .Name }}">
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
  {{ end }}
</nav>
