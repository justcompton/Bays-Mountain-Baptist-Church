<style>
  .nav-toggle { display: none; }
  .nav-links { display: flex; }
  .hamburger-btn { display: none; background: none; border: none; font-size: 1.8rem; color: white; cursor: pointer; }
  @media (max-width: 700px) {
    .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 1rem; }
    .nav-toggle:checked ~ .nav-links { display: flex; }
    .hamburger-btn { display: block; }
  }
</style>

<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l center items-center justify-between">
    <a href="{{ .Site.Home.RelPermalink }}" class="f3 fw2 hover-white white-90 dib no-underline">
      {{ .Site.Title }}
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="hamburger-btn">&#9776;</label>

    <div class="flex-l items-center">
      {{ if .Site.Menus.main }}
      <ul class="nav-links pl0 mr3">
        {{ range .Site.Menus.main }}
        <li class="list f5 f4-ns fw4 dib pr3">
          <a class="hover-white white-90 no-underline" href="{{ .URL }}" title="{{ .Name }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
      {{ end }}
    </div>
  </div>
</nav>
